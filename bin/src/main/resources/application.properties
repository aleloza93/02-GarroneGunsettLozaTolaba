spring.application.name=02-GarroneGunsettLozaTolaba
server.port=${SERVER_PORT:8080}

# Crear el esquema con scripts/01-crear-esquema.sql antes de iniciar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/02-GarroneGunsettLozaTolaba}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Para desarrollo del TP. No borra ni carga datos de prueba al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Fechas de negocio consistentes en los cuatro modulos.
hogarya.zona-horaria=America/Argentina/Buenos_Aires
